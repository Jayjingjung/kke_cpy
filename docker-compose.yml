version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: khounkham_db
      MYSQL_USER: khounkham
      MYSQL_PASSWORD: khounkham_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: khounkham
      DB_PASSWORD: khounkham_secret
      DB_DATABASE: khounkham_db
      JWT_SECRET: production-jwt-secret-change-me
      JWT_REFRESH_SECRET: production-refresh-secret-change-me
      CORS_ORIGIN: http://localhost
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NUXT_API_BASE_INTERNAL: http://backend:4000
      NUXT_PUBLIC_API_BASE: http://localhost
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data:
  uploads:
